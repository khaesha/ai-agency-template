name: Check Ponytail updates

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: update-ponytail

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Compare bundled files with upstream
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bundle=agency/skills/ponytail
          metadata="$bundle/upstream.json"
          upstream=$(jq -er '.repository' "$metadata")
          current=$(jq -er '.tag' "$metadata")
          latest=$(gh api "repos/$upstream/releases/latest" --jq '.tag_name')
          stable_tag='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! $current =~ $stable_tag || ! $latest =~ $stable_tag ]]; then
            printf 'Expected stable vMAJOR.MINOR.PATCH tags, got %s and %s.\n' "$current" "$latest" >&2
            exit 1
          fi

          if [[ $current == "$latest" ]]; then
            echo "Ponytail $current is already bundled."
            exit 0
          fi

          if [[ $(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1) != "$latest" ]]; then
            echo "Ponytail $current is newer than upstream's latest release $latest."
            exit 0
          fi

          commit=$(gh api "repos/$upstream/commits/tags/$latest" --jq '.sha')
          candidate=$(mktemp -d)
          trap 'rm -rf -- "$candidate"' EXIT

          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$upstream/contents/skills/ponytail/SKILL.md" \
            -f "ref=$commit" > "$candidate/SKILL.md"
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$upstream/contents/LICENSE" \
            -f "ref=$commit" > "$candidate/LICENSE"

          if cmp -s "$bundle/SKILL.md" "$candidate/SKILL.md" && \
             cmp -s "$bundle/LICENSE" "$candidate/LICENSE"; then
            echo "Release $latest has no changes to the bundled files."
            exit 0
          fi

          jq --arg tag "$latest" --arg commit "$commit" \
            '.tag = $tag | .commit = $commit' "$metadata" > "$candidate/upstream.json"
          mv "$candidate/"{SKILL.md,LICENSE,upstream.json} "$bundle/"

          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "release=https://github.com/$upstream/releases/tag/$latest" >> "$GITHUB_OUTPUT"

      - name: Open pull request for review
        if: steps.check.outputs.tag != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: updates/ponytail-${{ steps.check.outputs.tag }}
          title: Update Ponytail to ${{ steps.check.outputs.tag }}
          commit-message: Update Ponytail to ${{ steps.check.outputs.tag }}
          body: |
            Review the bundled skill and license before merging.

            [Upstream release](${{ steps.check.outputs.release }})
          add-paths: |
            agency/skills/ponytail/SKILL.md
            agency/skills/ponytail/LICENSE
            agency/skills/ponytail/upstream.json
